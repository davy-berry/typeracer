<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <title>Type Racer</title>


    <!-- CSS Styles -->
    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body class="d-flex flex-column min-vh-100">
    <header class="text-center py-5" style="background-color: #ff6347;">
        <div class="container">
            <h1 class="text-white mb-4">Type Racer</h1>
            <button class="btn btn-light">Instructions</button>
        </div>
    </header>

    <main>
        <section class="container py-5">
            <div class="row g-4">
                <div class="col-12 col-md-8">
                    <div class="p-4 bg-light rounded shadow-sm">
                        <div class="input-group mb-3">
                            <label class="input-group-text" for="inputGroupSelect01">Select Difficulty</label>
                            <select class="form-select" id="inputGroupSelect01">
                                <option selected>Choose</option>
                                <option value="1">Easy</option>
                                <option value="2">Medium</option>
                                <option value="3">High</option>
                            </select>
                        </div>
                        <h2>Typing Test</h2>
                        <p>Start your typing challenge and measure your speed and accuracy in real time.</p>

                        <div class="input-group mb-3">
                            <span class="input-group-text" id="inputGroup-sizing-default">Default</span>
                            <input type="text" class="form-control" aria-label="Sizing example input"
                                aria-describedby="inputGroup-sizing-default">
                        </div>

                        <div class="input-group">
                            <span class="input-group-text">With textarea</span>
                            <textarea class="form-control" aria-label="With textarea"></textarea>
                        </div>
                        <div class="d-flex justify-content-center">
                            <button type="button" class="btn btn-outline-orange">Start</button>
                            <button type="button" class="btn btn-outline-orange">Stop</button>
                            <button type="button" class="btn btn-outline-orange">Retry</button>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <div id="results-area" class="p-4  rounded">
                        <h2>Stats</h2>
                        <p>View your results, progress, and personal bests after each run.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white p-3 mt-auto">
        <div class="container text-center">
            &copy; 2024 Type Racer. All rights reserved.
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="assets/js/script.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
</body>

</html>
