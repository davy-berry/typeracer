<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <title>Type Racer</title>


    <!-- CSS Styles -->
    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body class="d-flex flex-column min-vh-100">
    <header class="text-center py-5">
        <div class="container">
            <h1 class="text-white mb-4">Type Racer</h1>
            <button class="btn btn-light">Instructions</button>
        </div>
    </header>

    <main>
        <section class="container py-5">
            <div class="row g-4">
                <div class="col-12 col-md-8">
                    <div class="p-4 bg-light rounded shadow-sm">
                        <div class="input-group mb-3">
                            <label class="input-group-text" for="inputGroupSelect01">Select Difficulty</label>
                            <select class="form-select" id="inputGroupSelect01">
                                <option value="1">Easy</option>
                                <option value="2">Medium</option>
                                <option value="3">Hard</option>
                            </select>
                        </div>

                        <div class="test-area">
                            <p class="lead">Test your typing speed by typing the text shown below:</p>
                            <div class="mb-3 p-3 border" id="sample-text">
                                <!-- sample text is inserted here using JS -->
                            </div>
                        </div>

                        <div class="input-group">
                            <label class="form-label visually-hidden" for="user-input">Type Here</label>
                            <textarea class="form-control" id="user-input" rows="5" placeholder="Click the start button to begin the test" aria-label="With textarea" disabled></textarea>
                        </div>
                        <div class="d-flex justify-content-center">
                            <button type="button" class="btn btn-outline-orange" id="start-button">Start</button>
                            <button type="button" class="btn btn-outline-orange" id="stop-button" disabled>Stop</button>
                            <button type="button" class="btn btn-outline-orange" id="reset-button">Retry</button>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <div id="results-area" class="text-center p-4 rounded">
                        <h2>Results</h2>
                        <div>
                            <p>Level: <span id="level">Easy</span></p>
                        </div>
                        <div>
                            <p>Time: <span id="time">0</span>s</p>
                        </div>
                        <div>
                            <p>WPM: <span id="wpm">0</span></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white p-3 mt-auto">
        <div class="container text-center">
            &copy; 2024 Type Racer. All rights reserved.
        </div>
    </footer>

    <!-- JavaScript -->

    <script src="assets/js/script.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
</body>

</html>
